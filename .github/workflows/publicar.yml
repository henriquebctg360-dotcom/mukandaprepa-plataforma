# Publica o site no cPanel sempre que algo entra no ramo main.
#
# Porquê assim: o cPanel da Fluxo não tem Terminal, por isso não há maneira de
# correr `npm install` e `npm run build` no servidor. Quem compila é o GitHub,
# que depois envia só a pasta dist/ — os ficheiros prontos. Acabam os zips.
#
# Vai por SFTP, sobre SSH, com chave. O alojamento não oferece contas de FTP,
# e ainda bem: a chave é mais segura do que uma palavra-passe e não anda a
# viajar em cada ligação.
#
# Usa-se o `lftp` em modo espelho e NÃO o rsync, de propósito: o rsync precisa
# de uma shell a sério do outro lado, e aqui não sabemos se há. O SFTP funciona
# mesmo em contas sem shell.
#
# O que é preciso configurar uma vez (ver README, secção "Publicação"):
#   Secret   → SSH_CHAVE_PRIVADA
#   Variable → SSH_SERVIDOR, SSH_UTILIZADOR, SSH_PORTA, SSH_PASTA

name: Publicar no cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite publicar à mão, pelo botão do GitHub

concurrency:
  group: publicar-cpanel
  cancel-in-progress: false

jobs:
  publicar:
    name: Compilar e enviar
    runs-on: ubuntu-latest
    # Se alguma coisa encravar, morre em 15 minutos em vez de ficar horas a
    # gastar minutos da conta. Um envio normal leva 2 a 3.
    timeout-minutes: 15

    env:
      SERVIDOR: ${{ vars.SSH_SERVIDOR }}
      UTILIZADOR: ${{ vars.SSH_UTILIZADOR }}
      PORTA: ${{ vars.SSH_PORTA || '22' }}
      PASTA: ${{ vars.SSH_PASTA || 'public_html' }}

    steps:
      - name: Ir buscar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Compilar o site
        run: npm run build

      - name: Confirmar que o build está completo
        run: |
          test -f dist/index.html || { echo "Falta o index.html em dist/"; exit 1; }
          test -f dist/.htaccess || { echo "Falta o .htaccess em dist/ — sem ele as rotas dão 404"; exit 1; }
          echo "dist/ tem $(find dist -type f | wc -l) ficheiros, $(du -sh dist | cut -f1)"

      - name: Preparar a chave e conhecer o servidor
        env:
          CHAVE: ${{ secrets.SSH_CHAVE_PRIVADA }}
        run: |
          test -n "$SERVIDOR" || { echo "Falta a variable SSH_SERVIDOR"; exit 1; }
          test -n "$UTILIZADOR" || { echo "Falta a variable SSH_UTILIZADOR"; exit 1; }
          test -n "$CHAVE" || { echo "O secret SSH_CHAVE_PRIVADA está vazio"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # Tira os fins de linha do Windows. Se a chave passou por um editor
          # do Windows vem com caracteres que o OpenSSH recusa, e isso não se
          # vê a olho nu. É das causas mais comuns.
          printf '%s\n' "$CHAVE" | tr -d '\r' > ~/.ssh/chave
          chmod 600 ~/.ssh/chave

          if erro=$(ssh-keygen -y -P "" -f ~/.ssh/chave 2>&1 >/dev/null); then
            echo "Chave lida e válida."
          else
            echo "A chave privada não foi aceite."
            echo ""
            echo "O que o OpenSSH diz: $erro"
            echo ""
            echo "O que está no secret (sem mostrar a chave):"
            echo "  linhas ............ $(wc -l < ~/.ssh/chave)"
            echo "  primeira linha .... $(head -1 ~/.ssh/chave | cut -c1-45)"
            echo "  última linha ...... $(tail -1 ~/.ssh/chave | cut -c1-45)"
            if head -1 ~/.ssh/chave | grep -q '^ssh-'; then
              echo ""
              echo "  >> Isto é a chave PUBLICA, nao a privada."
              echo "     A privada esta na tabela Private Keys do cPanel, mais abaixo"
              echo "     na mesma pagina, e tem muitas linhas."
            fi
            case "$erro" in
              *passphrase*)
                echo ""
                echo "  >> A chave tem passphrase. Gerar outra no cPanel deixando os"
                echo "     campos da passphrase VAZIOS, autorizar, e usar essa."
                ;;
            esac
            exit 1
          fi

          ssh-keyscan -p "$PORTA" -H "$SERVIDOR" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || { echo "O servidor não respondeu na porta $PORTA"; exit 1; }
          echo "Servidor conhecido."

      # Este passo existe para o envio nunca mais ficar pendurado.
      # BatchMode=yes impede o ssh de pedir uma palavra-passe que ninguém vai
      # escrever: em vez de esperar para sempre, falha em segundos e diz porquê.
      - name: Testar a ligação antes de enviar
        timeout-minutes: 2
        run: |
          if echo "pwd" | sftp -b - -i ~/.ssh/chave -P "$PORTA" \
               -o BatchMode=yes -o ConnectTimeout=20 \
               "$UTILIZADOR@$SERVIDOR"; then
            echo "Ligação estabelecida."
          else
            echo ""
            echo "Não entrou. As causas, por ordem de probabilidade:"
            echo "  1. A chave pública não foi AUTORIZADA no cPanel"
            echo "     SSH Access > Manage SSH Keys > (chave pública) Manage > Authorize"
            echo "  2. O utilizador está errado — deve ser o do cPanel, sem @ nem domínio"
            echo "  3. O alojamento tem o acesso SSH desligado para esta conta"
            exit 1
          fi

      - name: Enviar para o cPanel
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/chave -p $PORTA -o BatchMode=yes -o ConnectTimeout=20';
            set sftp:auto-confirm yes;
            set net:timeout 20;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set xfer:clobber on;
            open -u $UTILIZADOR, sftp://$SERVIDOR;
            mirror --reverse --verbose --parallel=4 --exclude-glob .git* --exclude-glob index.html ./dist/ $PASTA;
            put -O $PASTA ./dist/index.html
          "
          # mirror --reverse envia; SEM --delete, de propósito. Dentro do
          # public_html estão as pastas api.mukandaprepa.com e
          # app.mukandaprepa.com, criadas pelo cPanel. Apagar o que não
          # reconhece levá-las-ia à frente.
          #
          # O index.html vai em ÚLTIMO lugar, sozinho, e por isso está
          # excluído do espelho. É ele que nomeia os ficheiros de assets/:
          # se chegar primeiro, quem abrir o site nesse intervalo pede um
          # JavaScript que ainda não existe. Enviado no fim, os ficheiros
          # que ele nomeia já lá estão todos.

      - name: Confirmar que o site responde
        run: |
          sleep 5
          codigo=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://www.mukandaprepa.com/" || echo 000)
          echo "https://www.mukandaprepa.com/ respondeu $codigo"
          test "$codigo" = "200" || echo "AVISO: o site não devolveu 200. Verificar o .htaccess e o SSL no painel."
