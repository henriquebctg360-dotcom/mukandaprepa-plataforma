<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <!-- ESP-27 — ícone do separador. Antes era a marca sobre fundo
         transparente e ocupava 78% do quadrado: ao lado dos separadores do
         Gmail ou do Facebook aparecia fina e apagada. Passou a ser um
         ladrilho laranja de cantos arredondados, com a marca a branco, a
         preencher o quadrado todo. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FB6D1D" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ESP-24 — as duas fontes que aparecem logo no primeiro ecrã. Sem isto
         o navegador só as descobre depois de ler a folha de estilos, e o
         texto fica a trocar de letra à frente de quem está a ler. -->
    <link rel="preload" href="/fontes/montserrat-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fontes/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Plataforma angolana de preparação para os exames de acesso ao ensino superior: maratonas de exercícios, aulas online e uma comunidade de estudantes." />
    <title>MUKANDA PREPA — Preparação para o acesso à universidade</title>

    <!-- ESP-23 — o que aparece quando o link é partilhado no WhatsApp, no
         Facebook ou no LinkedIn. Estes programas NÃO executam JavaScript:
         lêem só o que está aqui escrito. Por isso o título e a descrição que
         cada página escreve em src/components/useMeta.js servem ao Google,
         mas nas partilhas vale sempre o que está nesta secção.
         O endereço da imagem tem de ser absoluto e apontar para o domínio
         real — nos pré-visualizadores um caminho relativo não funciona. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MUKANDA PREPA" />
    <meta property="og:locale" content="pt_AO" />
    <meta property="og:title" content="MUKANDA PREPA — Preparação para o acesso à universidade" />
    <meta property="og:description" content="Maratonas de exercícios com questões de exames reais, aulas online de correcção e uma comunidade de estudantes. Preparar hoje. Liderar amanhã." />
    <meta property="og:url" content="https://www.mukandaprepa.com/" />
    <meta property="og:image" content="https://www.mukandaprepa.com/og-mukandaprepa.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MUKANDA PREPA — preparação para o acesso à universidade" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MUKANDA PREPA — Preparação para o acesso à universidade" />
    <meta name="twitter:description" content="Maratonas de exercícios com questões de exames reais, aulas online de correcção e uma comunidade de estudantes." />
    <meta name="twitter:image" content="https://www.mukandaprepa.com/og-mukandaprepa.png" />

    <link rel="canonical" href="https://www.mukandaprepa.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
